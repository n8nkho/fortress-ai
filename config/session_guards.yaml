# Portfolio session macro entry guards (Fortress stack + Classic trading-bot).
entry_guards:
  market_relative_underperformance:
    enabled: true
    threshold_alpha_vs_spy_pct: -0.50
    description: "Blocks new entries if session alpha vs SPY is below threshold"

market_relative:
  enabled: true
  underperformance_threshold: -0.5  # percent; block when alpha_vs_spy_pct below this

market_relative_underperformance:
  enabled: true
  market_relative_underperformance_enabled: true
  max_underperformance_pct: -0.50  # -0.50% alpha vs SPY triggers block
  cooldown_seconds: 3600
  underperformance_threshold_pct: -0.5
  market_relative_underperformance_threshold_pct: -0.5
  market_relative_underperformance_threshold: -0.5
  market_relative_underperformance_threshold_bps: -50
